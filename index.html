<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veeam POC Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="veeam-config.js"></script>
<style>
:root{--navy:#002060;--green:#00D15F;--blue:#01B0FE;--ink:#1D1F2A;--grey:#505861;
--border:#E3E7EA;--tint:#E9FBF1;--input:#F4FBF7;--off:#F5F7F8;--grad:linear-gradient(90deg,#00D15F,#01B0FE);}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;color:var(--ink);background:var(--off)}
header.nav{display:flex;align-items:center;justify-content:space-between;padding:12px 22px;background:#fff;border-bottom:3px solid var(--green);position:sticky;top:0;z-index:20}
header.nav img{height:28px}
header.nav .who{font-size:13px;color:var(--navy);font-weight:700;display:flex;align-items:center;gap:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:10px 22px 0;background:#fff;border-bottom:1px solid var(--border)}
.tabs button{background:#fff;border:1px solid var(--border);border-bottom:none;border-radius:10px 10px 0 0;padding:9px 14px;font-weight:700;color:var(--grey);cursor:pointer}
.tabs button.active{color:var(--navy);border-color:var(--green);box-shadow:inset 0 -3px 0 var(--green)}
.wrap{max-width:1100px;margin:0 auto;padding:22px 20px 70px}
h1{color:var(--navy);font-size:24px;margin:0 0 4px}h2{color:var(--navy);font-size:16px;margin:18px 0 10px}
.sub{color:var(--grey);margin:0 0 16px;font-size:14px}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:20px;box-shadow:0 1px 3px rgba(16,24,40,.05);margin-bottom:16px}
.loginbox{max-width:430px;margin:5vh auto 0}.loginbox h1,.loginbox .sub{text-align:center}
.hero{border-radius:16px;padding:30px;color:#fff;margin-bottom:16px;background:radial-gradient(130% 170% at 100% 100%, rgba(0,209,95,.5) 0%, rgba(0,209,95,0) 46%),linear-gradient(120deg,#001A4D 0%,#002060 42%,#0047C7 100%)}
.hero .eyebrow{font-size:12px;letter-spacing:2px;font-weight:700;color:#8FE9C0;text-transform:uppercase}
.hero h1{color:#fff;font-size:28px;margin:8px 0 4px}.hero p{margin:0;color:#D7E3FF}
label{display:block;font-size:12px;font-weight:700;color:var(--navy);margin:10px 0 4px}.req{color:#e02424}
input,select,textarea{width:100%;font-family:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--border);border-radius:9px;background:var(--input);color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(0,209,95,.2);background:#fff}
button{font-family:inherit;font-size:14px;font-weight:700;padding:10px 16px;border-radius:10px;cursor:pointer;border:2px solid transparent}
.primary{background:linear-gradient(90deg,#00D15F,#01B0FE);color:#04231A;border:none}
.ghost{background:#fff;color:var(--navy);border:2px solid var(--border)}.ghost:hover{border-color:var(--navy)}
.danger{background:#fff;color:#B3261E;border:2px solid #F1C4C0}.small{padding:6px 10px;font-size:12.5px;border-radius:8px}
.linkbtn{background:none;border:none;color:#0a8f47;cursor:pointer;font-weight:700;padding:0}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:8px}
.tile{cursor:pointer;border:1px solid var(--border);border-radius:16px;padding:24px;background:#fff;box-shadow:0 2px 8px rgba(16,24,40,.05);transition:.15s;text-decoration:none;display:block}
.tile:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(16,24,40,.10);border-color:var(--green)}
.tile .ic{width:50px;height:50px;border-radius:12px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:12px}
.tile h3{margin:0 0 6px;color:var(--navy);font-size:17px}.tile p{margin:0;color:var(--grey);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
th{background:var(--navy);color:#fff;text-align:left;padding:9px 10px;font-size:12px}
td{border-bottom:1px solid var(--border);padding:8px 10px;vertical-align:top}tr:nth-child(even) td{background:#F7FBF9}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}
.p-active{background:#E7F8EE;color:#0a7d3f}.p-pending{background:#FFF4E5;color:#8a5a00}.p-blocked{background:#FDECEC;color:#B3261E}
.p-final{background:#E7F8EE;color:#0a7d3f}.p-draft{background:#FFF7E0;color:#8a6d00}.p-poc{background:#EAF1FF;color:#274bb5}.p-demo{background:#E7F8EE;color:#0a7d3f}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:6px 0 8px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px}.kpi .n{font-size:26px;font-weight:800;color:var(--navy)}.kpi .l{font-size:12px;color:var(--grey)}
.kpi.dist{border-left:5px solid var(--blue)}.kpi.part{border-left:5px solid var(--green)}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:8px}
.chartbox{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px}.chartbox h3{margin:0 0 8px;color:var(--navy);font-size:14px}
canvas{max-height:260px}
.msg{padding:11px;border-radius:9px;margin:12px 0;font-weight:700;display:none}.msg.ok{background:var(--tint);color:#04231A;display:block;border:1px solid var(--green)}.msg.err{background:#FDECEC;color:#B3261E;display:block}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px}.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.subtabs button{border:1px solid var(--border);background:#fff;color:var(--grey);border-radius:999px;padding:7px 13px;font-weight:700;font-size:12.5px;cursor:pointer}
.subtabs button.active{color:#04231A;background:var(--tint);border-color:var(--green)}
.hide{display:none}.note{color:var(--grey);font-size:12px}.crumb{color:var(--grey);font-size:13px;margin-bottom:10px}
.foot{color:var(--grey);font-size:11px;text-align:center;padding:20px}
@media(max-width:820px){.charts{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}}
</style></head>

AACKTKhJ6sSaAAAAAAAAAAAAFJVQk0wQawIAAAAAAAAAAFBEQk0yQ6wJAAAAAAAAAABA0TwKoSYZ8rO0FwAAAAAAAAAAAAB99OX8ROX3aS8C9jNZEwAAAAAAAAAAgKL4QqhJFpmsCQAAAAAAAAAAQBH8fn6i8mXai4CDiDUBAAAAAAAAAADIs5WIuD0/UXma9kLgdRyDDgAAAAAAAAAAQF59FRHjQk2yzmRNAAAAAAAAAAAA8uZ5RNxz7Dl5IdYEAAAAAAAAAAAgT55GxO9N0yRPHIMOAAAAAAAAAABAXnwZEf8h1CRvTNYEAAAAAAAAAAAg61Zid5rmo7QXAsch1gQAAAAAAAAAACCrnkfEl/MTlXtpLwROQqwJAAAAAAAAAABAFn0VEffmJyoraS8ETkqsCQAAAAAAAAAAQJY48pzCEWsCAAAAAAAAAACQBY48p7DEmgAAAAAAAAAAAKRpJSK+iIiv5icqz9NeDAyCWBMAAAAAAAAAAIA0rETEF/MTlS/TXggMmlgTAAAAAAAAAACAYXoUu1M0RZqUhlgTAAAAAAAAAACAQXseEV/FbqT5KO3FwLCJNQEAAAAAAAAAABiUryLikSmalJ1YEwAAAAAAAAAAgH56GhFfxu4UzedpLwayQKwJAAAAAAAAAADASTyPiEexG2l+NT9RWUl5PZA5Yk0AAAAAAAAAAACOYn+c+Wh+ovI05fVA5ok1AQAAAAAAAAAAeJ2nsRtnJv8rzoRjEGsCAAAAAAAAAACUUxJhJpIfP4qIFceZQ//8fy8OCcW0u4A9AAAAAElFTkSuQmCC" alt="Veeam"><div class="who"><span id="whoText"></span><button class="ghost small hide" id="logoutBtn" onclick="doLogout()">Log out</button></div></header>
<div class="tabs hide" id="adminTabs"></div>
<div id="app"><div class="wrap"><div class="card loginbox"><h1>Veeam POC Portal</h1><p class="sub">Loading…</p></div></div></div>
<div class="foot">Veeam POC Portal</div>
<script>
const SB = (window.SUPABASE_URL && window.SUPABASE_ANON_KEY && window.supabase)
  ? window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY) : null;
const app=document.getElementById("app");
let me=null, charts=[];
function esc(s){return String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function pill(s){const m={active:"p-active",pending:"p-pending",blocked:"p-blocked",Final:"p-final",Draft:"p-draft","Completed":"p-final","On-going":"p-draft",POC:"p-poc",Demo:"p-demo",super_admin:"p-poc",admin:"p-demo",user:"p-pending"};return '<span class="pill '+(m[s]||'')+'">'+esc(s)+'</span>';}
function gv(id){const e=document.getElementById(id);return e?e.value:"";}
function val(id){return (document.getElementById(id).value||"").trim();}
function msg(id,t,ok){const m=document.getElementById(id);if(m){m.textContent=t;m.className="msg "+(ok?"ok":"err");}}
function clearCharts(){charts.forEach(c=>{try{c.destroy();}catch(e){}});charts=[];}
function setWho(){document.getElementById("whoText").textContent=me?(me.full_name||me.email)+" · "+(me.org_name||""):"";document.getElementById("logoutBtn").classList.toggle("hide",!me);}

/* ---------- boot / auth ---------- */
async function boot(){
  if(!SB){app.innerHTML='<div class="wrap"><div class="card loginbox"><h1>Veeam POC Portal</h1><p class="sub">Not configured yet.</p><p class="note">Add <b>veeam-config.js</b> with your Supabase URL and anon key (see veeam-config.example.js).</p></div></div>';return;}
  SB.auth.onAuthStateChange((event,session)=>{ if(event==="PASSWORD_RECOVERY"){ renderRecovery(); } });
  const { data:{ session } } = await SB.auth.getSession();
  if(session){ await afterLogin(); } else { renderAuth(); }
}
async function afterLogin(){
  const { data:{ user } } = await SB.auth.getUser();
  if(!user){ renderAuth(); return; }
  let { data:prof } = await SB.from('profiles').select('*').eq('id',user.id).maybeSingle();
  me = prof || {id:user.id,email:user.email,status:'pending',role:'user'};
  setWho();
  if(me.status==='pending'){ document.getElementById("adminTabs").classList.add("hide"); screen("Awaiting approval","Your account is registered and awaiting administrator approval. You'll be able to sign in once approved."); return; }
  if(me.status==='blocked'){ await SB.auth.signOut(); me=null; setWho(); screen("Account blocked","This account has been blocked. Please contact the administrator."); return; }
  if(me.role==='admin'||me.role==='super_admin'){ renderAdmin(); } else { renderUserMenu(); }
}
async function doLogout(){ await SB.auth.signOut(); me=null; setWho(); document.getElementById("adminTabs").classList.add("hide"); renderAuth(); }
function screen(title,text){app.innerHTML=`<div class="wrap"><div class="card loginbox"><h1>${esc(title)}</h1><p class="sub">${esc(text)}</p><button class="ghost" onclick="doLogout()">Back to login</button></div></div>`;}

function renderAuth(){clearCharts();document.getElementById("adminTabs").classList.add("hide");
  app.innerHTML=`<div class="wrap"><div class="card loginbox"><h1>Veeam POC Portal</h1><p class="sub">Sign in with your email, or sign up if you're new.</p>
    <div id="m" class="msg"></div>
    <label>Email</label><input id="le" type="email" autocomplete="username">
    <label>Password</label><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="primary" style="width:100%;margin-top:14px" onclick="doLogin()">Log in</button>
    <p class="sub" style="margin-top:12px"><button class="linkbtn" onclick="renderSignup()">Create an account</button> &nbsp;·&nbsp; <button class="linkbtn" onclick="doForgot()">Forgot password?</button></p>
  </div></div>`;}
async function doLogin(){ msg("m","Signing in…",true);
  const {error}=await SB.auth.signInWithPassword({email:val("le"),password:val("lp")});
  if(error){ msg("m",error.message,false); return; }
  await afterLogin();
}
function renderSignup(){clearCharts();app.innerHTML=`<div class="wrap"><div class="card loginbox"><h1>Create your account</h1><p class="sub">You'll confirm your email, then an admin approves access.</p>
  <div id="m" class="msg"></div>
  <label>Company Name <span class="req">*</span></label><input id="sc">
  <label>SE Name <span class="req">*</span></label><input id="sn">
  <label>SE Email <span class="req">*</span></label><input id="se" type="email">
  <label>SE Contact <span class="req">*</span></label><input id="sp">
  <label>Relation with Veeam <span class="req">*</span></label><select id="sr"><option value="">—</option><option>Distributor</option><option>Partner</option><option>Veeam Employee</option></select>
  <label>Password <span class="req">*</span></label><input id="spw" type="password">
  <button class="primary" style="width:100%;margin-top:14px" onclick="doSignup()">Sign up</button>
  <p class="sub" style="margin-top:12px"><button class="linkbtn" onclick="renderAuth()">&#8592; Back to login</button></p></div></div>`;}
async function doSignup(){
  const c=val("sc"),n=val("sn"),e=val("se"),p=val("sp"),r=val("sr"),pw=val("spw");
  if(!c||!n||!e||!p||!r||!pw){ msg("m","Please complete all fields.",false); return; }
  msg("m","Creating your account…",true);
  const {error}=await SB.auth.signUp({email:e,password:pw,options:{data:{full_name:n,company:c,contact:p,relation:r},emailRedirectTo:location.href.split('#')[0]}});
  if(error){ msg("m",error.message,false); return; }
  app.innerHTML=`<div class="wrap"><div class="card loginbox"><h1>Thanks, ${esc(n)}!</h1><p class="sub">Check your inbox to confirm your email. After confirming, your account waits for admin approval before you can sign in.</p><button class="ghost" onclick="renderAuth()">Back to login</button></div></div>`;
}
async function doForgot(){ const e=prompt("Enter your account email to receive a password reset link:"); if(!e)return;
  const {error}=await SB.auth.resetPasswordForEmail(e,{redirectTo:location.href.split('#')[0]});
  alert(error?("Error: "+error.message):"If that email exists, a password reset link has been sent.");
}
function renderRecovery(){clearCharts();document.getElementById("adminTabs").classList.add("hide");
  app.innerHTML=`<div class="wrap"><div class="card loginbox"><h1>Set a new password</h1><div id="m" class="msg"></div>
    <label>New password</label><input id="np" type="password">
    <label>Confirm password</label><input id="cp" type="password">
    <button class="primary" style="width:100%;margin-top:14px" onclick="doRecovery()">Update password</button></div></div>`;}
async function doRecovery(){ const a=val("np"),b=val("cp"); if(!a||a!==b){ msg("m","Passwords are empty or do not match.",false); return; }
  const {error}=await SB.auth.updateUser({password:a}); if(error){ msg("m",error.message,false); return; }
  msg("m","Password updated. Loading…",true); await afterLogin();
}

/* ---------- USER portal ---------- */
function renderUserMenu(){clearCharts();document.getElementById("adminTabs").classList.add("hide");
  app.innerHTML=`<div class="wrap">
    <div class="hero"><div class="eyebrow">Veeam POC Portal</div><h1>Welcome, ${esc(me.full_name||me.email)}</h1><p>${esc(me.org_name||"")} · ${esc(me.relation||"")}</p></div>
    <div class="menu">
      <a class="tile" href="poc.html" target="_blank"><div class="ic">&#9998;</div><h3>POC Template</h3><p>Open the POC form to capture engagement, features, sizing and sign-off.</p></a>
      <a class="tile" href="demo_activity.html" target="_blank"><div class="ic">&#127916;</div><h3>Demo Activity</h3><p>Log a product demo — lighter than a POC, no customer sign-off.</p></a>
      <div class="tile" onclick="userReport()"><div class="ic">&#128202;</div><h3>Report &amp; Dashboard</h3><p>Charts and a list of your own POC &amp; Demo activities.</p></div>
      <div class="tile" onclick="userGuide()"><div class="ic">&#128214;</div><h3>Veeam Best Practice Guide</h3><p>Product-wise best-practice guides maintained by Veeam.</p></div>
    </div></div>`;}

async function fetchMyActivities(){
  const [{data:pocs},{data:demos}]=await Promise.all([
    SB.from('poc_submissions').select('*').eq('user_id',me.id),
    SB.from('demo_activities').select('*').eq('user_id',me.id)]);
  return toActs(pocs||[],demos||[]);
}
function toActs(pocs,demos){
  const p=pocs.map(x=>({type:"POC",relation:x.relation||"",org:x.org_name||"",engineer:(x.payload&&x.payload["Conducted by — Name"])||"",email:x.user_email||"",customer:x.customer_name||"",products:x.products||[],bom:x.bom||"",stage:x.submission_status==="Final"?"Completed":"On-going",result:x.outcome||"",updated:(x.updated_at||x.created_at||"").slice(0,10)}));
  const d=demos.map(x=>({type:"Demo",relation:x.relation||"",org:x.org_name||"",engineer:(x.payload&&x.payload["Name of person conducting demo"])||"",email:x.user_email||"",customer:x.customer_name||"",products:x.products||[],bom:"",stage:"Completed",result:x.outcome||"",updated:(x.created_at||"").slice(0,10)}));
  return p.concat(d);
}
let userF={type:"",product:""}, myActs=[];
async function userReport(){clearCharts();userF={type:"",product:""};
  app.innerHTML='<div class="wrap"><button class="ghost small" onclick="renderUserMenu()">&#8592; Back</button><h2>My Activity Dashboard</h2><p class="note">Loading…</p></div>';
  myActs=await fetchMyActivities();
  const nP=myActs.filter(a=>a.type==="POC").length,nD=myActs.filter(a=>a.type==="Demo").length;
  const prodOpts=[...new Set(myActs.flatMap(a=>a.products))].map(p=>'<option>'+esc(p)+'</option>').join("");
  app.innerHTML=`<div class="wrap"><button class="ghost small" onclick="renderUserMenu()">&#8592; Back</button>
    <h2>My Activity Dashboard</h2><p class="note">POC &amp; Demo activities for <b>${esc(me.email)}</b> · click a chart to filter.</p>
    <div class="kpis"><div class="kpi"><div class="n">${myActs.length}</div><div class="l">Total activities</div></div>
      <div class="kpi"><div class="n">${nP}</div><div class="l">POCs</div></div>
      <div class="kpi"><div class="n">${nD}</div><div class="l">Demos</div></div>
      <div class="kpi"><div class="n">${new Set(myActs.map(a=>a.customer)).size}</div><div class="l">Customers</div></div></div>
    <div class="charts"><div class="chartbox"><h3>Activity type</h3><canvas id="uType"></canvas></div><div class="chartbox"><h3>Activities by product</h3><canvas id="uProd"></canvas></div></div>
    <div class="card"><div class="toolbar"><b>My activities</b>
      <label style="margin:0">Type</label><select id="fUType" style="width:auto" onchange="onUserCtl()"><option value="">All</option><option>POC</option><option>Demo</option></select>
      <label style="margin:0">Product</label><select id="fUProd" style="width:auto" onchange="onUserCtl()"><option value="">All</option>${prodOpts}</select>
      <button class="ghost small" onclick="clearUserF()">Clear</button>
      <button class="ghost small" onclick="exportRows(JSON.stringify(currentUserRows()))">Download CSV</button></div>
      <div id="uChips"></div><div id="uTable"></div></div></div>`;
  if(window.Chart){doughnut("uType",["POC","Demo"],[nP,nD],["#01B0FE","#00D15F"],(l)=>setUserF({type:l}));barByProducts("uProd",myActs,(l)=>setUserF({product:l}));}
  renderUserTable();
}
function onUserCtl(){userF.type=gv("fUType");userF.product=gv("fUProd");renderUserTable();}
function setUserF(p){Object.assign(userF,p);if(document.getElementById("fUType"))document.getElementById("fUType").value=userF.type;if(document.getElementById("fUProd"))document.getElementById("fUProd").value=userF.product;renderUserTable();}
function clearUserF(){userF={type:"",product:""};["fUType","fUProd"].forEach(id=>{if(document.getElementById(id))document.getElementById(id).value="";});renderUserTable();}
function currentUserRows(){return myActs.filter(a=>(!userF.type||a.type===userF.type)&&(!userF.product||(a.products||[]).includes(userF.product)));}
function renderUserTable(){const rows=currentUserRows();
  document.getElementById("uChips").innerHTML=chips({Type:userF.type,Product:userF.product},"clearUserF")+'<div class="note" style="margin-bottom:6px">'+rows.length+' activity record(s)</div>';
  let h='<table><thead><tr><th>Type</th><th>Customer</th><th>Products</th><th>Tentative BOM</th><th>Stage</th><th>Result</th><th>Updated</th></tr></thead><tbody>';
  rows.forEach(x=>h+='<tr><td>'+pill(x.type)+'</td><td>'+esc(x.customer)+'</td><td>'+esc((x.products||[]).join(", "))+'</td><td>'+esc(x.bom||'—')+'</td><td>'+pill(x.stage)+'</td><td>'+esc(x.result||'—')+'</td><td>'+esc(x.updated)+'</td></tr>');
  if(!rows.length)h+='<tr><td colspan=7>No activities.</td></tr>';document.getElementById("uTable").innerHTML=h+'</tbody></table>';}

async function userGuide(){clearCharts();app.innerHTML='<div class="wrap"><button class="ghost small" onclick="renderUserMenu()">&#8592; Back</button><h2>Veeam Best Practice Guide</h2><div id="gt"></div><div id="gc" class="card">Loading…</div></div>';
  const {data}=await SB.from('best_practice_guide').select('*').order('product'); window._guide=data||[]; guideView((data&&data[0]&&data[0].product)||"");}
function guideView(prod){const gs=window._guide||[];document.getElementById("gt").innerHTML='<div class="subtabs">'+gs.map(g=>`<button class="${g.product===prod?'active':''}" onclick="guideView('${esc(g.product)}')">${esc(g.product)}</button>`).join("")+'</div>';
  const g=gs.find(x=>x.product===prod);const rows=(g&&g.rows)||[];let h='<h2 style="margin-top:0">'+esc(prod)+'</h2><table><thead><tr><th style="width:30%">Topic</th><th>Recommendation</th></tr></thead><tbody>';
  rows.forEach(r=>h+='<tr><td><b>'+esc(r[0])+'</b></td><td>'+esc(r[1])+'</td></tr>');if(!rows.length)h+='<tr><td colspan=2>No content yet.</td></tr>';document.getElementById("gc").innerHTML=h+'</tbody></table>';}

/* ---------- ADMIN portal ---------- */
let adminTab="dashboard",adminOrg=null,dashF={relation:"",type:"",product:"",org:""},allActs=[];
function isSuper(){return me&&me.role==='super_admin';}
function inScope(orgName){ if(isSuper())return true; if(me&&me.scope_all)return true; return me&&Array.isArray(me.scope_orgs)&&me.scope_orgs.indexOf(orgName)>=0; }
function renderAdmin(){clearCharts();const t=document.getElementById("adminTabs");t.classList.remove("hide");
  let def;
  if(isSuper()){ def=[["approvals","Approvals"],["distributors","Distributors"],["partners","Partners"],["dashboard","Activity Dashboard"],["team","Team & Roles"],["guide","Guide"]]; }
  else { def=[["dashboard","Activity Dashboard"],["distributors","Distributors"],["partners","Partners"],["guide","Guide"]]; }
  if(!def.find(d=>d[0]===adminTab)) adminTab=def[0][0];
  t.innerHTML=def.map(([k,l])=>`<button class="${adminTab===k?'active':''}" onclick="adminGo('${k}')">${l}</button>`).join("");
  if(adminTab==="approvals")adminApprovals();
  else if(adminTab==="distributors")adminOrgs("Distributor");
  else if(adminTab==="partners")adminOrgs("Partner");
  else if(adminTab==="dashboard")adminDashboard();
  else if(adminTab==="team")adminTeam();
  else adminGuide();}
function adminGo(k){adminTab=k;adminOrg=null;renderAdmin();}
async function adminApprovals(){app.innerHTML='<div class="wrap"><h1>Registrations</h1><p class="note">Loading…</p></div>';
  const {data}=await SB.from('profiles').select('*').eq('status','pending').order('created_at');
  let h='<div class="wrap"><h1>Registrations</h1><p class="sub">Approve pending sign-ups so they can log in.</p><div class="card">';
  if(!data||!data.length){app.innerHTML=h+'No pending registrations.</div></div>';return;}
  h+='<table><thead><tr><th>Company</th><th>Relation</th><th>SE Name</th><th>Email</th><th>Contact</th><th>Action</th></tr></thead><tbody>';
  data.forEach(u=>h+='<tr><td>'+esc(u.org_name)+'</td><td>'+esc(u.relation)+'</td><td>'+esc(u.full_name)+'</td><td>'+esc(u.email)+'</td><td>'+esc(u.contact)+'</td><td><button class="primary small" onclick="approve(\''+u.id+'\')">Approve</button> <button class="danger small" onclick="rejectU(\''+u.id+'\')">Reject</button></td></tr>');
  app.innerHTML=h+'</tbody></table></div></div>';}
async function approve(id){await SB.from('profiles').update({status:'active'}).eq('id',id);renderAdmin();}
async function rejectU(id){if(!confirm("Reject and remove this registration (profile)?"))return;await SB.from('profiles').delete().eq('id',id);renderAdmin();}

async function adminOrgs(rel){if(adminOrg)return adminCompanyUsers(adminOrg);
  app.innerHTML='<div class="wrap"><h1>'+rel+'s</h1><p class="note">Loading…</p></div>';
  const [{data:orgs},{data:pocs},{data:demos},{data:profs}]=await Promise.all([
    SB.from('organizations').select('*').eq('relation',rel).order('name'),
    SB.from('poc_submissions').select('org_name'),SB.from('demo_activities').select('org_name'),SB.from('profiles').select('org_name,status')]);
  const cnt=(arr,n)=>(arr||[]).filter(x=>x.org_name===n).length;
  const list=(orgs||[]).filter(o=>inScope(o.name));
  const verb=isSuper()?"manage":"view";
  let h='<div class="wrap"><h1>'+rel+'s</h1><p class="sub">Click a company to '+verb+' its users'+(isSuper()?"":" (view-only — your access is scoped)")+'.</p><div class="card"><table><thead><tr><th>Company</th><th>Users</th><th>Active</th><th>POCs</th><th>Demos</th><th></th></tr></thead><tbody>';
  list.forEach(o=>{const us=(profs||[]).filter(p=>p.org_name===o.name);const act=us.filter(p=>p.status==='active').length;
    h+='<tr><td><b>'+esc(o.name)+'</b></td><td>'+us.length+'</td><td>'+act+'</td><td>'+cnt(pocs,o.name)+'</td><td>'+cnt(demos,o.name)+'</td><td><button class="ghost small" onclick="openOrg(\''+esc(o.name)+'\')">'+(isSuper()?"Manage":"View")+' &#8594;</button></td></tr>';});
  if(!list.length)h+='<tr><td colspan=6>No '+rel.toLowerCase()+' organizations in your access.</td></tr>';
  app.innerHTML=h+'</tbody></table></div></div>';}
function openOrg(n){adminOrg=n;renderAdmin();}
async function adminCompanyUsers(name){app.innerHTML='<div class="wrap"><p class="note">Loading…</p></div>';
  const {data:us}=await SB.from('profiles').select('*').eq('org_name',name).order('full_name');
  const su=isSuper();
  let h='<div class="wrap"><div class="crumb"><button class="linkbtn" onclick="backOrgs()">&#8592; Back to list</button></div><h1>'+esc(name)+'</h1><p class="sub">'+(su?"Manage user accounts.":"User accounts (view-only).")+'</p><div class="card"><table><thead><tr><th>SE Name</th><th>Email</th><th>Contact</th><th>Status</th>'+(su?'<th>Actions</th>':'')+'</tr></thead><tbody>';
  (us||[]).forEach(u=>{h+='<tr><td>'+esc(u.full_name)+'</td><td>'+esc(u.email)+'</td><td>'+esc(u.contact)+'</td><td>'+pill(u.status)+'</td>';
    if(su){h+='<td>'+(u.status==='blocked'?'<button class="ghost small" onclick="setStatus(\''+u.id+'\',\'active\')">Unblock</button>':'<button class="ghost small" onclick="setStatus(\''+u.id+'\',\'blocked\')">Block</button>')+
      ' <button class="ghost small" onclick="resetPw(\''+esc(u.email)+'\')">Send reset</button> <button class="danger small" onclick="delUser(\''+u.id+'\')">Delete</button></td>';}
    h+='</tr>';});
  if(!us||!us.length)h+='<tr><td colspan='+(su?5:4)+'>No users.</td></tr>';app.innerHTML=h+'</tbody></table></div></div>';}
function backOrgs(){adminOrg=null;renderAdmin();}
async function setStatus(id,s){await SB.from('profiles').update({status:s}).eq('id',id);renderAdmin();}
async function resetPw(email){const {error}=await SB.auth.resetPasswordForEmail(email,{redirectTo:location.href.split('#')[0]});alert(error?("Error: "+error.message):"Password-reset email sent to "+email+".");}
async function delUser(id){if(!confirm("Delete this user's profile & their activities? (Their login is disabled; full auth deletion is done from the Supabase dashboard.)"))return;await SB.from('profiles').delete().eq('id',id);renderAdmin();}

async function adminDashboard(){clearCharts();dashF={relation:"",type:"",product:"",org:""};
  app.innerHTML='<div class="wrap"><h1>Activity Dashboard</h1><p class="note">Loading…</p></div>';
  const [{data:pocs},{data:demos}]=await Promise.all([SB.from('poc_submissions').select('*'),SB.from('demo_activities').select('*')]);
  allActs=toActs(pocs||[],demos||[]);
  const acts=allActs,nPOC=acts.filter(a=>a.type==="POC").length,nDemo=acts.filter(a=>a.type==="Demo").length;
  const dist=acts.filter(a=>a.relation==="Distributor"),part=acts.filter(a=>a.relation==="Partner");
  const cT=(arr,t)=>arr.filter(x=>x.type===t).length;
  const prodOpts=[...new Set(acts.flatMap(a=>a.products))].map(p=>'<option>'+esc(p)+'</option>').join("");
  app.innerHTML=`<div class="wrap"><h1>Activity Dashboard</h1><p class="sub">All POC &amp; Demo activity, with Distributor vs Partner segregation. Click any chart to filter.</p>
    <div class="kpis"><div class="kpi"><div class="n">${acts.length}</div><div class="l">Total activities</div></div>
      <div class="kpi"><div class="n">${nPOC}</div><div class="l">POCs</div></div><div class="kpi"><div class="n">${nDemo}</div><div class="l">Demos</div></div>
      <div class="kpi"><div class="n">${new Set(acts.map(a=>a.org)).size}</div><div class="l">Organizations</div></div></div>
    <div class="kpis"><div class="kpi dist"><div class="n">${dist.length}</div><div class="l">Distributor activities &nbsp;(${cT(dist,"POC")} POC / ${cT(dist,"Demo")} Demo)</div></div>
      <div class="kpi part"><div class="n">${part.length}</div><div class="l">Partner activities &nbsp;(${cT(part,"POC")} POC / ${cT(part,"Demo")} Demo)</div></div></div>
    <div class="charts"><div class="chartbox"><h3>Distributor vs Partner (by type)</h3><canvas id="cRel"></canvas></div><div class="chartbox"><h3>Activity type</h3><canvas id="cType"></canvas></div></div>
    <div class="charts"><div class="chartbox"><h3>Activities by product</h3><canvas id="cProd"></canvas></div><div class="chartbox"><h3>Activities by organization</h3><canvas id="cOrg"></canvas></div></div>
    <div class="card"><div class="toolbar">
      <label style="margin:0">Category</label><select id="fRel" style="width:auto" onchange="onDashCtl()"><option value="">All</option><option>Distributor</option><option>Partner</option></select>
      <label style="margin:0">Type</label><select id="fType" style="width:auto" onchange="onDashCtl()"><option value="">All</option><option>POC</option><option>Demo</option></select>
      <label style="margin:0">Product</label><select id="fProd" style="width:auto" onchange="onDashCtl()"><option value="">All</option>${prodOpts}</select>
      <button class="ghost small" onclick="clearDash()">Clear filters</button><button class="ghost small" onclick="exportDash()">Export CSV</button></div>
      <div id="dashChips"></div><div id="dashTable"></div></div></div>`;
  if(window.Chart){
    stackedBar("cRel",["Distributor","Partner"],[{label:"POC",data:[cT(dist,"POC"),cT(part,"POC")],color:"#01B0FE"},{label:"Demo",data:[cT(dist,"Demo"),cT(part,"Demo")],color:"#00D15F"}],(l,ds)=>setDash({relation:l,type:ds}));
    doughnut("cType",["POC","Demo"],[nPOC,nDemo],["#01B0FE","#00D15F"],(l)=>setDash({type:l}));
    barByProducts("cProd",acts,(l)=>setDash({product:l}));barByKey("cOrg",acts,"org",(l)=>setDash({org:l}));}
  renderDashTable();
}
function onDashCtl(){dashF.relation=gv("fRel");dashF.type=gv("fType");dashF.product=gv("fProd");dashF.org="";renderDashTable();}
function setDash(p){Object.assign(dashF,p);["fRel","fType","fProd"].forEach(id=>{});if(document.getElementById("fRel"))document.getElementById("fRel").value=dashF.relation;if(document.getElementById("fType"))document.getElementById("fType").value=dashF.type;if(document.getElementById("fProd"))document.getElementById("fProd").value=dashF.product;renderDashTable();const t=document.getElementById("dashTable");if(t)t.scrollIntoView({behavior:"smooth",block:"nearest"});}
function clearDash(){dashF={relation:"",type:"",product:"",org:""};["fRel","fType","fProd"].forEach(id=>{if(document.getElementById(id))document.getElementById(id).value="";});renderDashTable();}
function currentDashRows(){return allActs.filter(a=>(!dashF.relation||a.relation===dashF.relation)&&(!dashF.type||a.type===dashF.type)&&(!dashF.product||(a.products||[]).includes(dashF.product))&&(!dashF.org||a.org===dashF.org));}
function renderDashTable(){const rows=currentDashRows();
  document.getElementById("dashChips").innerHTML=chips({Category:dashF.relation,Type:dashF.type,Product:dashF.product,Organization:dashF.org},"clearDash")+'<div class="note" style="margin-bottom:6px">'+rows.length+' activity record(s)</div>';
  let h='<table><thead><tr><th>Type</th><th>Relation</th><th>Organization</th><th>Engineer</th><th>Customer</th><th>Products</th><th>Tentative BOM</th><th>Stage</th><th>Result</th><th>Updated</th></tr></thead><tbody>';
  rows.forEach(x=>h+='<tr><td>'+pill(x.type)+'</td><td>'+esc(x.relation)+'</td><td>'+esc(x.org)+'</td><td>'+esc(x.engineer)+'</td><td>'+esc(x.customer)+'</td><td>'+esc((x.products||[]).join(", "))+'</td><td>'+esc(x.bom||'—')+'</td><td>'+pill(x.stage)+'</td><td>'+esc(x.result||'—')+'</td><td>'+esc(x.updated)+'</td></tr>');
  if(!rows.length)h+='<tr><td colspan=10>No records.</td></tr>';document.getElementById("dashTable").innerHTML=h+'</tbody></table>';}
function exportDash(){exportRows(JSON.stringify(currentDashRows()));}

let adminGuideProd="";
async function adminGuide(){
  const {data}=await SB.from('best_practice_guide').select('*').order('product');window._guide=data||[];
  if(!isSuper()){ // scoped admins get read-only guide
    app.innerHTML='<div class="wrap"><h1>Veeam Best Practice Guide</h1><div id="gt"></div><div id="gc" class="card"></div></div>';
    guideView((data&&data[0]&&data[0].product)||""); return; }
  adminGuideProd=(data&&data[0]&&data[0].product)||"";
  app.innerHTML='<div class="wrap"><h1>Best Practice Guide (editor)</h1><p class="sub">Edit product-wise guides. Each line is <b>Topic | Recommendation</b>.</p><div id="gt"></div><div id="ge" class="card"></div></div>';guideEdit(adminGuideProd);}

/* ---------- Team & Roles (super admin only) ---------- */
async function adminTeam(){app.innerHTML='<div class="wrap"><h1>Team &amp; Roles</h1><p class="note">Loading…</p></div>';
  const {data:profs}=await SB.from('profiles').select('*').order('role',{ascending:false}).order('full_name');
  let h='<div class="wrap"><h1>Team &amp; Roles</h1><p class="sub">Promote teammates and set what each admin can see. Super admin = full control; Admin = only assigned organizations; User = own activity only.</p><div class="card"><table><thead><tr><th>Name</th><th>Email</th><th>Relation</th><th>Role</th><th>Access</th><th></th></tr></thead><tbody>';
  (profs||[]).forEach(u=>{const scopeTxt=u.role==='super_admin'?'All (super)':(u.role==='admin'?(u.scope_all?'All organizations':((u.scope_orgs||[]).length?((u.scope_orgs||[]).join(", ")):'None set')):'—');
    h+='<tr><td>'+esc(u.full_name)+'</td><td>'+esc(u.email)+'</td><td>'+esc(u.relation||'')+'</td><td>'+pill(u.role)+'</td><td>'+esc(scopeTxt)+'</td><td><button class="ghost small" onclick="manageAccess(\''+u.id+'\')">Manage access</button></td></tr>';});
  if(!profs||!profs.length)h+='<tr><td colspan=6>No accounts.</td></tr>';
  app.innerHTML=h+'</tbody></table></div></div>';}
async function manageAccess(id){
  const [{data:u},{data:orgs}]=await Promise.all([SB.from('profiles').select('*').eq('id',id).maybeSingle(),SB.from('organizations').select('*').order('relation').order('name')]);
  if(!u)return;
  const scope=u.scope_orgs||[];
  let boxes=(orgs||[]).map(o=>'<label class="chk" style="font-size:13px"><input type="checkbox" class="scopebox" value="'+esc(o.name)+'" '+(scope.indexOf(o.name)>=0?'checked':'')+'> '+esc(o.name)+' <span class="note">('+esc(o.relation)+')</span></label>').join("");
  app.innerHTML=`<div class="wrap"><div class="crumb"><button class="linkbtn" onclick="adminGo('team')">&#8592; Back to Team &amp; Roles</button></div>
    <h1>Manage access — ${esc(u.full_name||u.email)}</h1><p class="sub">${esc(u.email)}</p><div id="m" class="msg"></div>
    <div class="card"><label>Role</label>
      <select id="mrole" onchange="mroleChange()"><option value="user"${u.role==='user'?' selected':''}>User (own activity only)</option><option value="admin"${u.role==='admin'?' selected':''}>Admin (scoped)</option><option value="super_admin"${u.role==='super_admin'?' selected':''}>Super admin (full control)</option></select>
      <div id="scopewrap" style="margin-top:14px">
        <label><input type="checkbox" id="scopeall" ${u.scope_all?'checked':''} onchange="mroleChange()" style="width:auto"> Access to <b>all organizations</b></label>
        <div id="orgboxes" style="margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:4px">${boxes}</div>
      </div>
      <div style="margin-top:14px"><button class="primary" onclick="saveAccess('${u.id}')">Save access</button></div>
    </div></div>`;
  mroleChange();
}
function mroleChange(){const role=gv("mrole");const sw=document.getElementById("scopewrap");const all=document.getElementById("scopeall");const ob=document.getElementById("orgboxes");
  sw.style.display=(role==='admin')?'':'none';
  if(ob)ob.style.display=(role==='admin'&&all&&!all.checked)?'grid':'none';}
async function saveAccess(id){const role=gv("mrole");const all=document.getElementById("scopeall")?document.getElementById("scopeall").checked:false;
  const orgs=[...document.querySelectorAll('.scopebox:checked')].map(c=>c.value);
  const patch={role:role,scope_all:(role==='admin'?all:false),scope_orgs:(role==='admin'&&!all?orgs:[])};
  const {error}=await SB.from('profiles').update(patch).eq('id',id);
  if(error){msg("m","Save failed: "+error.message,false);return;}
  adminGo('team');}
function guideEdit(prod){adminGuideProd=prod;const gs=window._guide||[];
  document.getElementById("gt").innerHTML='<div class="subtabs">'+gs.map(g=>`<button class="${g.product===prod?'active':''}" onclick="guideEdit('${esc(g.product)}')">${esc(g.product)}</button>`).join("")+'</div>';
  const g=gs.find(x=>x.product===prod);const rows=(g&&g.rows)||[];const txt=rows.map(r=>r[0]+" | "+r[1]).join("\n");
  document.getElementById("ge").innerHTML=`<h2 style="margin-top:0">${esc(prod)}</h2><textarea id="gtext" rows="12">${esc(txt)}</textarea><div style="margin-top:10px"><button class="primary" onclick="saveGuide('${esc(prod)}')">Save</button> <span id="gm" class="note"></span></div>`;}
async function saveGuide(prod){const lines=document.getElementById("gtext").value.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const i=l.indexOf("|");return i<0?[l,""]:[l.slice(0,i).trim(),l.slice(i+1).trim()];});
  const {error}=await SB.from('best_practice_guide').upsert({product:prod,rows:lines,updated_at:new Date().toISOString()});
  const gm=document.getElementById("gm");gm.textContent=error?("Error: "+error.message):("Saved "+lines.length+" row(s).");
  const g=(window._guide||[]).find(x=>x.product===prod);if(g)g.rows=lines;}

/* ---------- shared chart + export helpers ---------- */
function chips(obj,clearFn){const p=[];for(const k in obj){if(obj[k])p.push('<span class="pill p-poc">'+esc(k)+': '+esc(obj[k])+'</span>');}return p.length?('<div style="margin:8px 0">Filtered by: '+p.join(' ')+' &nbsp;<button class="linkbtn" onclick="'+clearFn+'()">clear all</button></div>'):'';}
function chartClick(cb){return function(e,els,ch){if(!els||!els.length)return;const el=els[0];const lbl=ch.data.labels[el.index];const ds=(el.datasetIndex!=null&&ch.data.datasets[el.datasetIndex])?ch.data.datasets[el.datasetIndex].label:'';cb(lbl,ds);};}
function doughnut(id,labels,data,colors,cb){const el=document.getElementById(id);if(!el)return;charts.push(new Chart(el,{type:"doughnut",data:{labels,datasets:[{data,backgroundColor:colors}]},options:{onClick:cb?chartClick(cb):undefined,plugins:{legend:{position:"bottom"}}}}));}
function stackedBar(id,labels,series,cb){const el=document.getElementById(id);if(!el)return;charts.push(new Chart(el,{type:"bar",data:{labels,datasets:series.map(s=>({label:s.label,data:s.data,backgroundColor:s.color}))},options:{onClick:cb?chartClick(cb):undefined,plugins:{legend:{position:"bottom"}},scales:{x:{stacked:true},y:{stacked:true,ticks:{precision:0}}}}}));}
function barByKey(id,rows,key,cb){const el=document.getElementById(id);if(!el)return;const m={};rows.forEach(r=>{const k=r[key]||"—";m[k]=(m[k]||0)+1;});charts.push(new Chart(el,{type:"bar",data:{labels:Object.keys(m),datasets:[{label:"Count",data:Object.values(m),backgroundColor:"#01B0FE"}]},options:{onClick:cb?chartClick(cb):undefined,plugins:{legend:{display:false}},scales:{y:{ticks:{precision:0}}}}}));}
function barByProducts(id,acts,cb){const el=document.getElementById(id);if(!el)return;const m={};acts.forEach(a=>{(a.products||[]).forEach(pr=>{m[pr]=(m[pr]||0)+1;});});charts.push(new Chart(el,{type:"bar",data:{labels:Object.keys(m),datasets:[{label:"Activities",data:Object.values(m),backgroundColor:"#01B0FE"}]},options:{onClick:cb?chartClick(cb):undefined,plugins:{legend:{display:false}},scales:{y:{ticks:{precision:0}}}}}));}
function exportRows(json){const rows=JSON.parse(json);if(!rows.length){alert("Nothing to export.");return;}const cols=Object.keys(rows[0]);const csv=[cols.join(",")].concat(rows.map(r=>cols.map(c=>'"'+String(Array.isArray(r[c])?r[c].join("; "):(r[c]==null?"":r[c])).replace(/"/g,'""')+'"').join(","))).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="veeam_activities.csv";a.click();}

boot();
</script>
</body></html>
